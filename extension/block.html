<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DistractFree — Site Blocked</title>
  <link rel="stylesheet" href="block.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="simple-container">
    <div class="simple-card">
      <div class="icon-circle">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      
      <h1 class="title">This site is paused</h1>
      
      <div class="info-section">
        <div class="info-row">
          <span class="label">Website</span>
          <span class="value" id="blocked-site">...</span>
        </div>
        <div class="info-row" id="timer-row">
          <span class="label">Time Remaining</span>
          <span class="value font-mono" id="remaining-time">--:--</span>
        </div>
      </div>

      <div class="actions">
        <button id="go-back-btn" class="btn btn-primary">
          Return to Google
        </button>
        <button id="unlock-btn" class="btn btn-secondary">
          Unlock for 5 Coins
        </button>
      </div>
      
      <p id="motivation-text" class="motivation">
        Stay focused. You can do this.
      </p>
    </div>
  </div>

  <script src="block.js"></script>
</body>
</html>
