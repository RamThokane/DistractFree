# Nightly retraining of the session-success models.
#
# Vercel has no Python, so the API can't retrain itself. Every night this job
# checks MongoDB; once 25+ real sessions have finished since the last
# training (or when run by hand with "force"), it retrains both models,
# commits the new backend/ml/model/*.json files and redeploys the API.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   MONGO_URI          the production database (same as backend/.env)
#   VERCEL_TOKEN       a token from vercel.com/account/tokens
#   VERCEL_ORG_ID      team id of the backend project (backend/.vercel/project.json)
#   VERCEL_PROJECT_ID  project id of distractfree-backend (same file)

name: Retrain models

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: Retrain even if fewer than 25 new sessions
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retrain-models
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

      - name: Install dependencies
        # The lock file is written by npm 11; npm 10 rejects its optional peer entries
        run: |
          npm install -g npm@11.7.0
          npm ci --omit=dev
          pip install -r ml/requirements.txt

      - name: Retrain if enough new sessions
        id: retrain
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: node ml/scheduledRetrain.js ${{ inputs.force && '--force' || '' }}

      - name: Commit new model files
        if: steps.retrain.outputs.retrained == 'true'
        run: |
          git config user.name "Ram Thokane"
          git config user.email "thokaneram@gmail.com"
          git add ml/model/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Retrain session-success models (scheduled)"
          # The regenerated training CSV comes from the database and is never committed
          git checkout -- .
          git pull --rebase
          git push

      - name: Deploy API
        if: steps.retrain.outputs.retrained == 'true'
        env:
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Pasted secrets often carry a trailing newline or space
          export VERCEL_ORG_ID="$(printf '%s' "$ORG_ID" | tr -d '[:space:]')"
          export VERCEL_PROJECT_ID="$(printf '%s' "$PROJECT_ID" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          npm install -g vercel@54.18.0
          echo "Org id: ${VERCEL_ORG_ID:0:5}… (${#VERCEL_ORG_ID} chars), project id: ${VERCEL_PROJECT_ID:0:4}… (${#VERCEL_PROJECT_ID} chars), token: ${#TOKEN} chars"
          vercel whoami --token "$TOKEN" || { echo "::error::VERCEL_TOKEN is invalid or expired"; exit 1; }
          vercel project inspect "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$TOKEN" >/dev/null \
            || { echo "::error::The token cannot see the backend project: create it with scope thokaneram-gmailcoms-projects, and check VERCEL_ORG_ID / VERCEL_PROJECT_ID"; exit 1; }
          vercel deploy --prod --yes --token "$TOKEN"
